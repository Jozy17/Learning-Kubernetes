# Break/fix t1-07: RBAC for the CI pipeline's ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: lab-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: lab-rbac
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bot-binding
  namespace: lab-rbac
subjects:
- kind: ServiceAccount
  name: ci-bot
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
