# Provided by setup: a backend Deployment and a "toolbox" client pod.
# Each nginx pod writes its own hostname into the page so you can SEE load balancing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-net
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        command: ["sh", "-c", "echo \"served by $(hostname)\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: lab-net
  labels:
    role: toolbox
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.16.0
    command: ["sleep", "infinity"]
