# Break/fix t1-04: an "api" backend and its Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        role: backend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        command: ["sh", "-c", "echo \"api ok from $(hostname)\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab-net
spec:
  selector:
    app: api-server
  ports:
  - port: 80
    targetPort: 8080
