# Provided by setup: a small "estate" to search through. Don't read this file
# before doing the tasks - finding things with kubectl IS the exercise.
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: lab-kubectl, labels: {tier: frontend}}
spec:
  replicas: 3
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: frontend}}
    spec:
      containers: [{name: nginx, image: nginx:1.30-alpine, resources: {requests: {cpu: 10m, memory: 16Mi}}}]
---
