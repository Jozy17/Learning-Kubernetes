# Break/fix t1-06: a "db" Deployment with its own PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: lab-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: lab-storage
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - name: db
        image: busybox:1.37
        command: ["sh", "-c", "echo db started > /var/lib/db/started; sleep infinity"]
        volumeMounts:
        - {name: data, mountPath: /var/lib/db}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
