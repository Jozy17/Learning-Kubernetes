# The Tier 1 lab cluster: 1 control-plane node + 2 worker nodes.
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
#
# Nutanix analogy: think of this as a tiny 3-node cluster. The control-plane
# node runs the "brains" (API server, scheduler, etcd) - roughly what Prism
# Element + the Acropolis leader do. Workers just run workloads.
# Unlike a real cluster, all three "nodes" are Docker containers on your PC.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8slab
nodes:
- role: control-plane
  # Expose NodePort 30080 on your PC's localhost:30080 (used in the services lab).
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    listenAddress: "127.0.0.1"
    protocol: TCP
- role: worker
- role: worker
